<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
</head>
<body>
  <!-- Dashboard tile: no padding, transparent background – Hostwerk draws the frame. The height follows the content. -->
  <div class="stat">
    <div class="k" data-i18n="tileTitle"></div>
    <div class="v" id="v" aria-live="polite">–</div>
    <div class="s" id="hint" data-i18n="tileHint"></div>
    <!-- Errors are part of the tile: a short reason and a retry instead of a "–" that stays forever -->
    <button type="button" class="btn xs" id="retry" hidden data-i18n="retry">Try again</button>
  </div>
  <script>
    async function load() {
      const v = document.getElementById('v'), hint = document.getElementById('hint'), retry = document.getElementById('retry');
      try {
        const list = await Hostwerk.services();
        v.textContent = `${Hostwerk.fmt.number(list.filter((s) => s.state === 'running').length)} / ${Hostwerk.fmt.number(list.length)}`;
        hint.textContent = Hostwerk.t('tileHint');
        retry.hidden = true;
      } catch {
        v.textContent = '–';
        hint.textContent = Hostwerk.t('tileFailed');
        retry.hidden = false;
      }
    }
    document.getElementById('retry').addEventListener('click', load);
    Hostwerk.ready().then(() => { load(); Hostwerk.on('service', load); Hostwerk.on('lang', load); });
  </script>
</body>
</html>
