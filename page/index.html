<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 1) The SDK: talks to Hostwerk and loads the design kit (card card-pad, btn, var(--…)). Always first. -->
  <script src="/ext-sdk.js"></script>
</head>
<body>
  <!-- 2) Texts come from locales/de.json and locales/en.json – data-i18n="key" fills them in.
       Sizes only from the design scale (var(--sp-*), var(--fs-*), var(--r-*)) – then the page follows Hostwerk's design. -->
  <p class="muted" id="hello" data-i18n="intro"></p>

  <div class="row" style="margin-bottom: var(--sp-3)">
    <button type="button" class="btn primary" id="count" data-i18n="countButton"></button>
    <span class="muted" id="counter" aria-live="polite"></span>
    <button type="button" class="btn ghost" id="settings" data-i18n="settings"></button>
  </div>

  <h2 data-i18n="services"></h2>
  <div id="list" class="grid-auto" aria-live="polite"><div class="hw-skeleton" style="height: calc(var(--sp-8) * 2)"></div></div>

  <!-- 3) Your logic in a separate file (scripts from the internet are not allowed – bundle everything). -->
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
